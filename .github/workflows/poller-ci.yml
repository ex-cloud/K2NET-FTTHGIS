name: SNMP Poller CI/CD

on:
  push:
    branches:
      - develop
    paths:
      - 'services/poller/**'
      - 'services/shared/**'
      - 'services/go.work'
      - '.github/workflows/poller-ci.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  build-and-test:
    name: Build & Test SNMP Poller
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: services/go.work

      - name: Test Poller
        run: |
          cd services/poller
          go test ./...

      - name: Build Binary
        run: |
          cd services/poller
          go build -o poller ./cmd/...

  deploy:
    name: Deploy SNMP Poller to Server
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Determine Environment
        id: env-val
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "DEPLOY_ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=staging" >> $GITHUB_ENV
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_ENV == 'production' && secrets.PROD_SSH_HOST || secrets.STAGING_SSH_HOST }}
          username: ${{ env.DEPLOY_ENV == 'production' && secrets.PROD_SSH_USER || secrets.STAGING_SSH_USER }}
          key: ${{ env.DEPLOY_ENV == 'production' && secrets.PROD_SSH_KEY || secrets.STAGING_SSH_KEY }}
          port: ${{ env.DEPLOY_ENV == 'production' && secrets.PROD_SSH_PORT || secrets.STAGING_SSH_PORT || 22 }}
          script: |
            cd /opt/project5
            git fetch origin
            if [ "${{ env.DEPLOY_ENV }}" = "production" ]; then
              git checkout main
              git pull origin main
            else
              git checkout develop
              git pull origin develop
            fi
            echo "Building poller..."
            cd services/poller && go build -o poller ./cmd/...
            echo "Restarting SNMP Poller service..."
            systemctl restart ftth-poller
            sleep 3
            systemctl status ftth-poller --no-pager
