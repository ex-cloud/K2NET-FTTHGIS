name: 🚀 Production Deploy Pipeline

# ============================================================
# ATURAN WAJIB DEPLOYMENT:
# Workflow ini adalah SATU-SATUNYA cara yang diizinkan untuk
# melakukan deployment ke production. Docker build DILARANG
# dijalankan langsung di server/VM untuk mencegah server overload.
#
# Alur: validate → docker-build (GHA Runner) → deploy (pull only)
# ============================================================

on:
  push:
    branches:
      - main
    paths:
      - 'apps/studio-admin/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'services/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all / frontend-admin / backend / gateways)'
        required: true
        default: 'frontend-admin'
        type: choice
        options:
          - frontend-admin
          - backend
          - all

jobs:
# ============================================================
# JOB 1: VALIDATE — Memastikan sintaks & build 100% lulus
# ============================================================
  validate-frontend-admin:
    name: ✅ Validate Frontend Admin (Next.js)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.service == 'all' ||
        github.event.inputs.service == 'frontend-admin'
      ) || (
        github.event_name == 'push'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Workspace Packages (@k2net/*)
        run: pnpm --filter "@k2net/*" build

      - name: Lint — studio-admin
        run: pnpm --filter @k2net/studio-admin lint

      - name: Build — studio-admin (Type-check + Next.js compile)
        run: pnpm --filter @k2net/studio-admin build
        env:
          NEXTAUTH_URL: https://system-gis.k2net.id
          NEXTAUTH_SECRET: build-time-placeholder
          NEXT_PUBLIC_APP_URL: https://system-gis.k2net.id
          NEXT_PUBLIC_AUTH_KEYCLOAK_ISSUER: https://auth-gis.k2net.id/realms/ftth-realm
          NEXT_PUBLIC_API_URL: https://gis.k2net.id/api/v1
          NEXT_PUBLIC_AUTH_KEYCLOAK_SERVER_URL: https://auth-gis.k2net.id

  validate-backend:
    name: ✅ Validate Backend (Spring Boot / Maven)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.service == 'all' ||
        github.event.inputs.service == 'backend'
      ) || (
        github.event_name == 'push' && (
          contains(github.event.head_commit.modified, 'apps/api/')
        )
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven — Compile (Verify 100% Java build)
        run: |
          cd apps/api
          mvn clean compile

# ============================================================
# JOB 2: DOCKER BUILD — Dijalankan di Runner GitHub, BUKAN di Server
# ============================================================
  docker-build-frontend-admin:
    name: 🐳 Docker Build — frontend-admin (GHA Runner)
    runs-on: ubuntu-latest
    needs: validate-frontend-admin
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/k2net-ftthgis/frontend-admin
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/studio-admin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_GIT_BRANCH=${{ github.ref_name }}
            NEXT_PUBLIC_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  docker-build-backend:
    name: 🐳 Docker Build — backend (GHA Runner)
    runs-on: ubuntu-latest
    needs: validate-backend
    if: always() && needs.validate-backend.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/k2net-ftthgis/backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

# ============================================================
# JOB 3: DEPLOY — SSH ke server, hanya docker pull + up (NO build on server)
# ============================================================
  deploy-production:
    name: 🚢 Deploy to Production (Pull Only — No Build on Server)
    runs-on: ubuntu-latest
    needs:
      - docker-build-frontend-admin
    if: always() && (needs.docker-build-frontend-admin.result == 'success' || needs.docker-build-backend.result == 'success')
    environment: production
    steps:
      - name: Deploy via SSH — Pull images & restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            set -e
            cd /opt/project5

            echo "=== [1/4] Sync kode dari main branch ==="
            git fetch origin
            git checkout main
            git pull origin main

            echo "=== [2/4] Pull images yang dibangun oleh GitHub Actions Runner ==="
            bash scripts/deploy.sh production frontend-admin

            echo "=== [3/4] Verifikasi Container Status ==="
            docker ps --filter "name=ftth-frontend-admin" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "✅ Deployment production studio-admin selesai!"
