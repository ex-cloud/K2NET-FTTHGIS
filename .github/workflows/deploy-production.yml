name: 🚀 Production Deploy Pipeline

# ============================================================
# ATURAN WAJIB DEPLOYMENT:
# Workflow ini adalah SATU-SATUNYA cara yang diizinkan untuk
# melakukan deployment ke production. Docker build DILARANG
# dijalankan langsung di server/VM untuk mencegah server overload.
#
# Alur: detect-changes → validate → docker-build (GHA Runner) → deploy (pull only)
# ============================================================

on:
  push:
    branches:
      - main
    paths:
      - 'apps/studio-admin/**'
      - 'apps/studio-tenant/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'services/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all / frontend-admin / frontend-tenant / backend / gateways)'
        required: true
        default: 'frontend-admin'
        type: choice
        options:
          - frontend-admin
          - frontend-tenant
          - backend
          - gateways
          - all

jobs:
# ============================================================
# JOB 0: DETECT CHANGES — Mendeteksi file mana yang berubah
# ============================================================
  changes:
    name: 🔍 Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      frontend_tenant: ${{ steps.filter.outputs.frontend_tenant }}
      backend: ${{ steps.filter.outputs.backend }}
      shared: ${{ steps.filter.outputs.shared }}
      map-gateway: ${{ steps.filter.outputs.map-gateway }}
      notification-gateway: ${{ steps.filter.outputs.notification-gateway }}
      payment-gateway: ${{ steps.filter.outputs.payment-gateway }}
      storage-gateway: ${{ steps.filter.outputs.storage-gateway }}
      gateway-whatsapp: ${{ steps.filter.outputs.gateway-whatsapp }}
      gateway-scheduler: ${{ steps.filter.outputs.gateway-scheduler }}
      gateway-export: ${{ steps.filter.outputs.gateway-export }}
      gateway-olt: ${{ steps.filter.outputs.gateway-olt }}
      gateway-audit: ${{ steps.filter.outputs.gateway-audit }}
      gateway-task: ${{ steps.filter.outputs.gateway-task }}
      gateway-ai: ${{ steps.filter.outputs.gateway-ai }}
      poller: ${{ steps.filter.outputs.poller }}
      observability-gateway: ${{ steps.filter.outputs.observability-gateway }}
      gateways_matrix: ${{ steps.set-matrix.outputs.gateways_matrix }}
      any_gateway_changed: ${{ steps.set-matrix.outputs.any_gateway_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'apps/studio-admin/**'
              - 'packages/**'
              - 'package.json'
              - 'scripts/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            frontend_tenant:
              - 'apps/studio-tenant/**'
              - 'packages/**'
              - 'package.json'
              - 'scripts/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            backend:
              - 'apps/api/**'
            shared:
              - 'services/shared/**'
              - 'services/go.work'
              - '.github/workflows/deploy-production.yml'
            map-gateway:
              - 'services/map-gateway/**'
            notification-gateway:
              - 'services/notification-gateway/**'
            payment-gateway:
              - 'services/payment-gateway/**'
            storage-gateway:
              - 'services/storage-gateway/**'
            gateway-whatsapp:
              - 'services/gateway-whatsapp/**'
            gateway-scheduler:
              - 'services/gateway-scheduler/**'
            gateway-export:
              - 'services/gateway-export/**'
            gateway-olt:
              - 'services/gateway-olt/**'
            gateway-audit:
              - 'services/gateway-audit/**'
            gateway-task:
              - 'services/gateway-task/**'
            gateway-ai:
              - 'services/gateway-ai/**'
            poller:
              - 'services/poller/**'
            observability-gateway:
              - 'services/observability-gateway/**'

      - name: Generate Go Gateways Build Matrix
        id: set-matrix
        run: |
          SERVICES=()
          SHARED="${{ steps.filter.outputs.shared }}"
          EVENT_NAME="${{ github.event_name }}"
          MANUAL_SERVICE="${{ github.event.inputs.service }}"
          
          if [[ "$SHARED" == "true" || ( "$EVENT_NAME" == "workflow_dispatch" && ( "$MANUAL_SERVICE" == "all" || "$MANUAL_SERVICE" == "gateways" ) ) ]]; then
            SERVICES=("map-gateway" "notification-gateway" "payment-gateway" "storage-gateway" "gateway-whatsapp" "gateway-scheduler" "gateway-export" "gateway-olt" "gateway-audit" "gateway-task" "poller" "gateway-ai" "observability-gateway")
          else
            if [[ "${{ steps.filter.outputs.map-gateway }}" == "true" ]]; then SERVICES+=("map-gateway"); fi
            if [[ "${{ steps.filter.outputs.notification-gateway }}" == "true" ]]; then SERVICES+=("notification-gateway"); fi
            if [[ "${{ steps.filter.outputs.payment-gateway }}" == "true" ]]; then SERVICES+=("payment-gateway"); fi
            if [[ "${{ steps.filter.outputs.storage-gateway }}" == "true" ]]; then SERVICES+=("storage-gateway"); fi
            if [[ "${{ steps.filter.outputs.gateway-whatsapp }}" == "true" ]]; then SERVICES+=("gateway-whatsapp"); fi
            if [[ "${{ steps.filter.outputs.gateway-scheduler }}" == "true" ]]; then SERVICES+=("gateway-scheduler"); fi
            if [[ "${{ steps.filter.outputs.gateway-export }}" == "true" ]]; then SERVICES+=("gateway-export"); fi
            if [[ "${{ steps.filter.outputs.gateway-olt }}" == "true" ]]; then SERVICES+=("gateway-olt"); fi
            if [[ "${{ steps.filter.outputs.gateway-audit }}" == "true" ]]; then SERVICES+=("gateway-audit"); fi
            if [[ "${{ steps.filter.outputs.gateway-task }}" == "true" ]]; then SERVICES+=("gateway-task"); fi
            if [[ "${{ steps.filter.outputs.gateway-ai }}" == "true" ]]; then SERVICES+=("gateway-ai"); fi
            if [[ "${{ steps.filter.outputs.poller }}" == "true" ]]; then SERVICES+=("poller"); fi
            if [[ "${{ steps.filter.outputs.observability-gateway }}" == "true" ]]; then SERVICES+=("observability-gateway"); fi
          fi
          
          # Build JSON manually
          JSON="["
          for i in "${!SERVICES[@]}"; do
            if [ $i -gt 0 ]; then JSON+=","; fi
            JSON+="\"${SERVICES[$i]}\""
          done
          JSON+="]"
          echo "gateways_matrix=${JSON}" >> $GITHUB_OUTPUT
          
          if [ ${#SERVICES[@]} -gt 0 ]; then
            echo "any_gateway_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_gateway_changed=false" >> $GITHUB_OUTPUT
          fi

# ============================================================
# JOB 1: VALIDATE — Memastikan sintaks & build 100% lulus
# ============================================================
  validate-frontend-admin:
    name: ✅ Validate Frontend Admin (Next.js)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.service == 'all' ||
        github.event.inputs.service == 'frontend-admin'
      ) || (
        github.event_name == 'push' && needs.changes.outputs.frontend == 'true'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Hardcoded Colors
        run: pnpm audit:colors

      - name: Validate Shared UI Typecheck
        run: pnpm --filter @k2net/ui typecheck

      - name: Validate Next.js Studio Admin Typecheck
        run: pnpm --filter @k2net/studio-admin typecheck

  validate-frontend-tenant:
    name: ✅ Validate Frontend Tenant (Vite SPA)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.service == 'all' ||
        github.event.inputs.service == 'frontend-tenant'
      ) || (
        github.event_name == 'push' && needs.changes.outputs.frontend_tenant == 'true'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Shared Packages
        run: |
          pnpm --filter @k2net/api-client typecheck
          pnpm --filter @k2net/map typecheck
          pnpm --filter @k2net/studio-tenant typecheck

      - name: Build Vite Production Bundle
        run: pnpm --filter @k2net/studio-tenant build

  validate-backend:
    name: ✅ Validate Backend (Spring Boot)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.service == 'all' ||
        github.event.inputs.service == 'backend'
      ) || (
        github.event_name == 'push' && needs.changes.outputs.backend == 'true'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Compile & Tests
        working-directory: apps/api
        run: mvn clean test -B -Dspring.profiles.active=test

  validate-gateways:
    name: ✅ Validate Go Gateways & Python AI
    runs-on: ubuntu-latest
    needs: changes
    if: |
      always() &&
      needs.changes.outputs.any_gateway_changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: 'services/go.work.sum'

      - name: Run Go Vet across services
        working-directory: services
        run: |
          for dir in */ ; do
            if [ -f "${dir}go.mod" ]; then
              echo "Validating Go module: ${dir}..."
              (cd "$dir" && go vet ./...)
            fi
          done

      - name: Set up Python 3.11 for AI Gateway
        if: needs.changes.outputs.gateway-ai == 'true' || needs.changes.outputs.shared == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python AI Syntax
        if: needs.changes.outputs.gateway-ai == 'true' || needs.changes.outputs.shared == 'true'
        working-directory: services/gateway-ai
        run: |
          if [ -d "app" ]; then
            python3 -m py_compile app/**/*.py
          fi

# ============================================================
# JOB 2: DOCKER BUILD — Dijalankan di Runner GitHub, BUKAN di Server
# ============================================================
  docker-build-frontend-admin:
    name: 🐳 Docker Build — frontend-admin (GHA Runner)
    runs-on: ubuntu-latest
    needs: [changes, validate-frontend-admin]
    if: always() && needs.validate-frontend-admin.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/k2net-ftthgis/frontend-admin
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/studio-admin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_GIT_BRANCH=${{ github.ref_name }}
            NEXT_PUBLIC_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  docker-build-frontend-tenant:
    name: 🐳 Docker Build — frontend-tenant (GHA Runner)
    runs-on: ubuntu-latest
    needs: [changes, validate-frontend-tenant]
    if: always() && needs.validate-frontend-tenant.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/k2net-ftthgis/frontend-tenant
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/studio-tenant/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  docker-build-backend:
    name: 🐳 Docker Build — backend (GHA Runner)
    runs-on: ubuntu-latest
    needs: [changes, validate-backend]
    if: always() && needs.validate-backend.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/k2net-ftthgis/backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  docker-build-gateways:
    name: 🐳 Docker Build — Go Gateways (GHA Runner)
    runs-on: ubuntu-latest
    needs: [changes, validate-gateways]
    if: |
      always() &&
      needs.changes.outputs.any_gateway_changed == 'true' &&
      (needs.validate-gateways.result == 'success' || needs.validate-gateways.result == 'skipped')
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.gateways_matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/k2net-ftthgis/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

# ============================================================
# JOB 3: DEPLOY — SSH ke server, hanya docker pull + up (NO build on server)
# ============================================================
  deploy-production:
    name: 🚢 Deploy to Production (Pull Only — No Build on Server)
    runs-on: ubuntu-latest
    needs:
      - changes
      - docker-build-frontend-admin
      - docker-build-frontend-tenant
      - docker-build-backend
      - docker-build-gateways
    if: |
      always() && (
        needs.docker-build-frontend-admin.result == 'success' ||
        needs.docker-build-frontend-tenant.result == 'success' ||
        needs.docker-build-backend.result == 'success' ||
        needs.docker-build-gateways.result == 'success'
      )
    environment: production
    steps:
      - name: Deploy via SSH — Pull images & restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          command_timeout: 30m
          timeout: 30m
          script: |
            set -e
            cd /opt/project5

            echo "=== [1/3] Sync kode dari main branch ==="
            git fetch origin
            git checkout main
            git pull origin main

            echo "=== [2/3] Pull & restart updated services ==="
            if [ "${{ needs.changes.outputs.frontend }}" == "true" ] || [ "${{ github.event.inputs.service }}" == "frontend-admin" ] || [ "${{ github.event.inputs.service }}" == "all" ]; then
              echo "Pulling frontend-admin..."
              bash scripts/deploy.sh production frontend-admin
            fi

            if [ "${{ needs.changes.outputs.frontend_tenant }}" == "true" ] || [ "${{ github.event.inputs.service }}" == "frontend-tenant" ] || [ "${{ github.event.inputs.service }}" == "all" ]; then
              echo "Pulling frontend-tenant..."
              bash scripts/deploy.sh production frontend-tenant
            fi

            if [ "${{ needs.changes.outputs.backend }}" == "true" ] || [ "${{ github.event.inputs.service }}" == "backend" ] || [ "${{ github.event.inputs.service }}" == "all" ]; then
              echo "Pulling backend..."
              bash scripts/deploy.sh production backend
            fi

            # Deploy Go & Python gateways if changed or manually triggered
            SERVICES_LIST="map-gateway notification-gateway payment-gateway storage-gateway gateway-whatsapp gateway-scheduler gateway-export gateway-olt gateway-audit gateway-task poller gateway-ai observability-gateway"
            for svc in $SERVICES_LIST; do
              CHANGED="false"
              if [ "$svc" == "map-gateway" ] && [ "${{ needs.changes.outputs.map-gateway }}" == "true" ]; then CHANGED="true"; fi
              if [ "$svc" == "notification-gateway" ] && [ "${{ needs.changes.outputs.notification-gateway }}" == "true" ]; then CHANGED="true"; fi
              if [ "$svc" == "payment-gateway" ] && [ "${{ needs.changes.outputs.payment-gateway }}" == "true" ]; then CHANGED="true"; fi
              if [ "$svc" == "storage-gateway" ] && [ "${{ needs.changes.outputs.storage-gateway }}" == "true" ]; then CHANGED="true"; fi
              if [ "$svc" == "gateway-whatsapp" ] && [ "${{ needs.changes.outputs.gateway-whatsapp }}" == "true" ]; then CHANGED="true"; fi
              if [ "$svc" == "gateway-scheduler" ] && [ "${{ needs.changes.outputs.gateway-scheduler }}" == "true" ]; then CHANGED="true"; fi
              if [ "$svc" == "gateway-export" ] && [ "${{ needs.changes.outputs.gateway-export }}" == "true" ]; then CHANGED="true"; fi
              if [ "$svc" == "gateway-olt" ] && [ "${{ needs.changes.outputs.gateway-olt }}" == "true" ]; then CHANGED="true"; fi
              if [ "$svc" == "gateway-audit" ] && [ "${{ needs.changes.outputs.gateway-audit }}" == "true" ]; then CHANGED="true"; fi
              if [ "$svc" == "gateway-task" ] && [ "${{ needs.changes.outputs.gateway-task }}" == "true" ]; then CHANGED="true"; fi
              if [ "$svc" == "gateway-ai" ] && [ "${{ needs.changes.outputs.gateway-ai }}" == "true" ]; then CHANGED="true"; fi
              if [ "$svc" == "poller" ] && [ "${{ needs.changes.outputs.poller }}" == "true" ]; then CHANGED="true"; fi
              if [ "$svc" == "observability-gateway" ] && [ "${{ needs.changes.outputs.observability-gateway }}" == "true" ]; then CHANGED="true"; fi

              # If shared libraries changed, we build/deploy all gateways
              if [ "${{ needs.changes.outputs.shared }}" == "true" ]; then CHANGED="true"; fi

              # Handle manual choice triggers
              if [ "${{ github.event.inputs.service }}" == "all" ] || [ "${{ github.event.inputs.service }}" == "gateways" ]; then CHANGED="true"; fi

              if [ "$CHANGED" == "true" ]; then
                echo "Deploying gateway: $svc..."
                docker pull ghcr.io/ex-cloud/k2net-ftthgis/$svc:latest || true
                docker compose -f docker-compose.gateways.yml up -d --no-build $svc
              fi
            done

            echo "=== [3/3] Verifikasi Container Status ==="
            docker ps --filter "name=ftth-" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "✅ Deployment production selesai!"
