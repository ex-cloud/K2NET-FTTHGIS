name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start services with Docker Compose (Test only)
        run: docker compose -f docker-compose.test.yml up -d
        timeout-minutes: 15
        env:
          DB_PASSWORD: postgres_test

      - name: Wait and debug services startup
        run: |
          sleep 10
          echo "=== Docker containers status ==="
          docker ps -a
          echo ""
          echo "=== PostgreSQL logs ==="
          docker logs ftth-postgres 2>&1 | tail -30
          echo ""
          echo "=== Redis logs ==="
          docker logs ftth-redis 2>&1 | tail -20
          echo ""
          echo "=== Backend logs ==="
          docker logs ftth-backend 2>&1 | tail -50

      - name: Wait for backend health
        run: |
          echo "Waiting for backend on :9090..."
          for i in $(seq 1 120); do
            if curl -fsS -m 5 http://localhost:9090/actuator/health >/dev/null 2>&1; then
              echo "✓ Backend is healthy"
              exit 0
            fi
            echo "Attempt $i/120... waiting 2s"
            sleep 2
          done
          echo "✗ Backend health check failed after 240 seconds"
          docker logs ftth-backend 2>&1 | tail -50
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install frontend dependencies
        working-directory: apps/studio
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/studio
        run: npx playwright install

      - name: Run Playwright E2E (Chromium)
        working-directory: apps/studio
        run: pnpm e2e -- --project=chromium --reporter=html
        continue-on-error: true

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/studio/test-results
            apps/studio/playwright-report
