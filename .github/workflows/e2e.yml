name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services with Docker Compose
        uses: docker/compose-action@v2
        with:
          files: docker-compose.yml
          args: up -d --build backend frontend postgres redis

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9090/actuator/health >/dev/null 2>&1; then
              echo "backend healthy"; exit 0;
            fi
            sleep 2
          done
          echo "backend did not become healthy"; exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install frontend dependencies
        working-directory: apps/studio
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/studio
        run: npx playwright install

      - name: Run Playwright E2E (Chromium)
        working-directory: apps/studio
        run: pnpm e2e -- --project=chromium --reporter=html
        continue-on-error: true

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/studio/test-results
            apps/studio/playwright-report
