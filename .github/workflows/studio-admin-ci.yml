name: Studio Admin CI (Validate Only)

# ==============================================================
# CI-only workflow untuk branch develop dan Pull Requests.
# Workflow ini TIDAK melakukan deploy. Hanya validasi kode.
# Deploy ke production harus melalui: deploy-production.yml
# ==============================================================

on:
  push:
    branches:
      - develop
    paths:
      - 'apps/studio-admin/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/studio-admin-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/studio-admin/**'
      - 'packages/**'

jobs:
  validate:
    name: ✅ Lint & Build — studio-admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared UI Package
        run: pnpm --filter @k2net/ui build

      - name: Lint
        run: pnpm --filter @k2net/studio-admin lint

      - name: Build (Next.js type-check + compile)
        run: pnpm --filter @k2net/studio-admin build
        env:
          NEXTAUTH_URL: https://system-gis.k2net.id
          NEXTAUTH_SECRET: build-time-placeholder
          NEXT_PUBLIC_APP_URL: https://system-gis.k2net.id
          NEXT_PUBLIC_AUTH_KEYCLOAK_ISSUER: https://auth-gis.k2net.id/realms/ftth-realm
          NEXT_PUBLIC_API_URL: https://gis.k2net.id/api/v1
          NEXT_PUBLIC_AUTH_KEYCLOAK_SERVER_URL: https://auth-gis.k2net.id

      - name: Audit hardcoded colors (anti-regression)
        run: |
          VIOLATIONS=$(grep -rn "text-zinc-\|bg-zinc-\|border-zinc-\|text-white\|bg-emerald-\|text-emerald-" \
            apps/studio-admin/src \
            --include="*.tsx" --include="*.ts" | wc -l || echo 0)
          echo "Hardcoded color violations found: $VIOLATIONS"
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "❌ ERROR: Ditemukan $VIOLATIONS pelanggaran warna hardcoded!"
            echo "Jalankan audit lokal: grep -rn 'text-zinc-\\|bg-zinc-\\|text-white' apps/studio-admin/src --include='*.tsx' | head -20"
            exit 1
          fi
          echo "✅ 0 pelanggaran warna hardcoded ditemukan."
