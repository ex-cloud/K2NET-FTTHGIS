version: '3.8'

services:
  # Ingress Controller (Traefik v3)
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=info"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./docker/certs:/certs:ro"
      - "./docker/traefik/dynamic:/etc/traefik/dynamic:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # API Gateway (Kong in DB-less mode)
  # Diakses oleh Nginx (host) melalui 127.0.0.1:8000
  kong:
    image: kong:latest
    container_name: kong
    restart: always
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: "info"
    volumes:
      - ./docker/kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8001:8001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kong.rule=(Host(`gis.k2net.id`) || HostRegexp(`^[a-z0-9-]+\\.gis\\.k2net\\.id$`) || HostRegexp(`^[a-z0-9-]+-gis\\.k2net\\.id$`)) && (PathPrefix(`/api/`) || PathPrefix(`/actuator/`) || PathPrefix(`/gateway/`) || PathPrefix(`/webhooks/payment`))"
      - "traefik.http.routers.kong.entrypoints=websecure"
      - "traefik.http.routers.kong.tls=true"
      - "traefik.http.routers.kong.priority=10"
      - "traefik.http.services.kong.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M

  # Database Spasial GIS
  postgres:
    image: pgrouting/pgrouting:16-3.5-4.0
    container_name: ftth-postgres
    restart: always
    environment:
      POSTGRES_DB: ftth_gis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ftth_gis"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ftth-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Identity Provider (Keycloak)
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.1
    container_name: ftth-keycloak
    restart: always
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: excloud
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_ADMIN_PASSWORD}" # Sesuai dengan konfigurasi lokal Anda
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://auth-gis.k2net.id
      KC_HTTP_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: "${DB_PASSWORD}"
    command: start-dev --http-port=8081
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`auth-gis.k2net.id`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8081"
    volumes:
      - keycloak_data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  # Martin Vector Tile Server (Rust PostGIS Map Tile Generator)
  martin:
    image: maplibre/martin
    container_name: ftth-martin
    restart: always
    environment:
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD}@postgres:5432/ftth_gis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.martin.rule=(Host(`gis.k2net.id`) || HostRegexp(`^[a-z0-9-]+\\.gis\\.k2net\\.id$`) || HostRegexp(`^[a-z0-9-]+-gis\\.k2net\\.id$`)) && (PathPrefix(`/catalog`) || PathPrefix(`/get_mvt_data/`))"
      - "traefik.http.routers.martin.entrypoints=websecure"
      - "traefik.http.routers.martin.tls=true"
      - "traefik.http.routers.martin.priority=10"
      - "traefik.http.services.martin.loadbalancer.server.port=3001"
    command: --listen-addresses 0.0.0.0:3001
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # SNMP Simulator (Python-based untuk mensimulasikan jaringan OLT/ODC)
  snmpsim:
    image: tandrup/snmpsim:latest
    container_name: ftth-snmpsim
    restart: always
    ports:
      - "161:161/udp"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # Centralized Monitoring (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: ftth-prometheus
    restart: always
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9092:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Visualization Dashboard (Grafana)
  grafana:
    image: grafana/grafana-oss:latest
    container_name: ftth-grafana
    restart: always
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Distributed Tracing (Zipkin)
  zipkin:
    image: openzipkin/zipkin-slim:latest
    container_name: ftth-zipkin
    restart: always
    ports:
      - "127.0.0.1:9411:9411"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Node Exporter (Host/OS metrics)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: ftth-node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "127.0.0.1:9100:9100"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  # Backend App Core
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ftth-backend
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ftth_gis
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - KEYCLOAK_SERVER_URL=https://auth-gis.k2net.id
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8081
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8081/realms/ftth-realm/protocol/openid-connect/certs
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN}
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - NOTIFICATION_GATEWAY_URL=http://host.docker.internal:5001
      - PAYMENT_GATEWAY_URL=http://host.docker.internal:5002
      - MAP_GATEWAY_URL=http://host.docker.internal:5003
      - STORAGE_GATEWAY_URL=http://host.docker.internal:5004
      - FRONTEND_URL=${FRONTEND_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - AUTH_KEYCLOAK_SECRET=${AUTH_KEYCLOAK_SECRET}
      - APP_DEVOPS_GITHUB_WEBHOOK_SECRET=${APP_DEVOPS_GITHUB_WEBHOOK_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  # Frontend App (Next.js)
  frontend:
    build:
      context: ./apps/studio
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GIT_BRANCH=${NEXT_PUBLIC_GIT_BRANCH:-main}
        - NEXT_PUBLIC_GIT_COMMIT=${NEXT_PUBLIC_GIT_COMMIT:-unknown}
    container_name: ftth-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:9090/api/v1
      - BACKEND_API_URL=http://backend:9090
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTH_KEYCLOAK_INTERNAL_URL=http://keycloak:8081
      - NEXT_PUBLIC_APP_URL=${FRONTEND_URL}
      - AUTH_KEYCLOAK_ID=ftth-gis-frontend
      - AUTH_KEYCLOAK_SECRET=${AUTH_KEYCLOAK_SECRET}
      - NEXT_PUBLIC_AUTH_KEYCLOAK_SERVER_URL=https://auth-gis.k2net.id
      - AUTH_KEYCLOAK_ISSUER=https://auth-gis.k2net.id/realms/ftth-realm
      - NEXT_PUBLIC_AUTH_KEYCLOAK_ISSUER=https://auth-gis.k2net.id/realms/ftth-realm
      - NOTIFICATION_GATEWAY_URL=http://host.docker.internal:5001
      - STORAGE_GATEWAY_URL=http://host.docker.internal:5004
      - GATEWAY_TOKEN=${GATEWAY_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`gis.k2net.id`) || HostRegexp(`^[a-z0-9-]+\\.gis\\.k2net\\.id$`) || HostRegexp(`^[a-z0-9-]+-gis\\.k2net\\.id$`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    depends_on:
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Self-Hosted S3-Compatible Object Storage (MinIO)
  minio:
    image: minio/minio:latest
    container_name: ftth-minio
    restart: always
    ports:
      - "127.0.0.1:9005:9000" # API Port (Host: 9005)
      - "127.0.0.1:9006:9001" # Web Console UI Port (Host: 9006)
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_SERVER_URL: "http://100.110.205.109:9005"
      MINIO_BROWSER_REDIRECT_URL: "http://100.110.205.109:9006"
      MINIO_KMS_SECRET_KEY: "${MINIO_KMS_SECRET_KEY}"
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M

  # Auto-initialize MinIO buckets on first boot
  minio-init:
    image: minio/mc:latest
    container_name: ftth-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      echo 'Waiting for MinIO server to be fully ready...';
      /usr/bin/mc alias set localminio http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}";
      
      echo 'Initializing S3 Buckets...';
      # 1. public-contents bucket (Public Read-Only)
      /usr/bin/mc mb --ignore-existing localminio/public-contents;
      /usr/bin/mc anonymous set download localminio/public-contents;
      
      # 2. tenant-assets bucket (Private)
      /usr/bin/mc mb --ignore-existing localminio/tenant-assets;
      /usr/bin/mc anonymous set private localminio/tenant-assets;
      
      # 3. db-backups bucket (Private)
      /usr/bin/mc mb --ignore-existing localminio/db-backups;
      /usr/bin/mc anonymous set private localminio/db-backups;
      
      # 4. Configure Lifecycle Rule (ILM) for db-backups (30 days retention)
      if ! /usr/bin/mc ilm rule ls localminio/db-backups | grep -q 'Expiration'; then
        echo 'Adding 30-day expiration rule to db-backups...';
        /usr/bin/mc ilm rule add --expire-days 30 localminio/db-backups;
      else
        echo 'Lifecycle rule already exists for db-backups.';
      fi

      # 5. Enable Server-Side Encryption (SSE-S3) for private buckets
      echo 'Configuring Server-Side Encryption (SSE-S3)...';
      /usr/bin/mc encrypt set sse-s3 localminio/tenant-assets;
      /usr/bin/mc encrypt set sse-s3 localminio/db-backups;

      echo 'MinIO S3 Buckets initialized successfully!';
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
  prometheus_data:
  grafana_data:
