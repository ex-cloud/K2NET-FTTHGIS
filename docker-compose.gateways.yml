version: "3.8"

services:
  notification-gateway:
    build:
      context: ./services
      dockerfile: notification-gateway/Dockerfile
    container_name: ftth-notification-gateway
    restart: always
    env_file:
      - ./services/.env
    environment:
      - PORT=5001
      - REDIS_ADDR=redis:6379
      - ENV_FILE_PATH=/opt/project5/services/.env
    volumes:
      - /etc/ftth/gateways.env:/opt/project5/services/.env
    ports:
      - "127.0.0.1:5001:5001"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  payment-gateway:
    build:
      context: ./services
      dockerfile: payment-gateway/Dockerfile
    container_name: ftth-payment-gateway
