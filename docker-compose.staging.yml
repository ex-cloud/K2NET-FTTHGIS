version: '3.8'

services:
  postgres-staging:
    image: pgrouting/pgrouting:16-3.5-4.0
    container_name: ftth-postgres-staging
    restart: always
    environment:
      POSTGRES_DB: ftth_gis_staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD_STAGING}"
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./docs/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ftth_gis_staging"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  redis-staging:
    image: redis:7-alpine
    container_name: ftth-redis-staging
    restart: always
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data_staging:/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  keycloak-staging:
    image: quay.io/keycloak/keycloak:26.1.1
    container_name: ftth-keycloak-staging
    restart: always
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: excloud_staging
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_ADMIN_PASSWORD_STAGING}"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://auth-gis-staging.k2net.id
      KC_HTTP_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-staging:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: "${DB_PASSWORD_STAGING}"
    command: start-dev --http-port=8081
    ports:
      - "127.0.0.1:18081:8081"
    volumes:
      - keycloak_data_staging:/opt/keycloak/data
    depends_on:
      postgres-staging:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  martin-staging:
    image: maplibre/martin
    container_name: ftth-martin-staging
    restart: always
    environment:
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD_STAGING}@postgres-staging:5432/ftth_gis_staging
    ports:
      - "127.0.0.1:13001:3001"
    command: --listen-addresses 0.0.0.0:3001
    depends_on:
      postgres-staging:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  backend-staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ftth-backend-staging
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=staging
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-staging:5432/ftth_gis_staging
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD_STAGING}
      - SPRING_DATA_REDIS_HOST=redis-staging
      - SPRING_DATA_REDIS_PORT=6379
      - KEYCLOAK_SERVER_URL=https://auth-gis-staging.k2net.id
      - KEYCLOAK_INTERNAL_URL=http://keycloak-staging:8081
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak-staging:8081/realms/ftth-realm/protocol/openid-connect/certs
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET_STAGING}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN_STAGING}
      - NOTIFICATION_GATEWAY_URL=http://host.docker.internal:5001
      - PAYMENT_GATEWAY_URL=http://host.docker.internal:5002
      - MAP_GATEWAY_URL=http://host.docker.internal:5003
      - STORAGE_GATEWAY_URL=http://host.docker.internal:5004
      - FRONTEND_URL=${FRONTEND_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - AUTH_KEYCLOAK_SECRET=${AUTH_KEYCLOAK_SECRET_STAGING}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:19090:9090"
    depends_on:
      postgres-staging:
        condition: service_healthy
      redis-staging:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  frontend-staging:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GIT_BRANCH=${NEXT_PUBLIC_GIT_BRANCH:-main}
        - NEXT_PUBLIC_GIT_COMMIT=${NEXT_PUBLIC_GIT_COMMIT:-unknown}
    container_name: ftth-frontend-staging
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://backend-staging:9090
      - BACKEND_API_URL=http://backend-staging:9090
      - AUTH_SECRET=${AUTH_SECRET_STAGING}
      - AUTH_TRUST_HOST=true
      - AUTH_KEYCLOAK_INTERNAL_URL=http://keycloak-staging:8081
      - NEXT_PUBLIC_APP_URL=${FRONTEND_URL}
      - AUTH_KEYCLOAK_ID=ftth-gis-frontend
      - AUTH_KEYCLOAK_SECRET=${AUTH_KEYCLOAK_SECRET_STAGING}
      - NEXT_PUBLIC_AUTH_KEYCLOAK_SERVER_URL=https://auth-gis-staging.k2net.id
      - AUTH_KEYCLOAK_ISSUER=https://auth-gis-staging.k2net.id/realms/ftth-realm
      - NEXT_PUBLIC_AUTH_KEYCLOAK_ISSUER=https://auth-gis-staging.k2net.id/realms/ftth-realm
      - STORAGE_GATEWAY_URL=http://host.docker.internal:5004
      - GATEWAY_TOKEN=${GATEWAY_TOKEN_STAGING}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      backend-staging:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data_staging:
  redis_data_staging:
  keycloak_data_staging:





