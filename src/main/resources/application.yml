server:
  port: 9090
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/x-protobuf
    min-response-size: 1024

spring:
  application:
    name: ftth-gis-core

  datasource:
    url: jdbc:postgresql://localhost:5432/ftth_gis
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # Prevent data loss on restart
    properties:
      "[hibernate.format_sql]": true

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ftth-realm
          jwk-set-uri: http://localhost:8081/realms/ftth-realm/protocol/openid-connect/certs

# Keycloak Admin Configuration
keycloak:
  server-url: http://localhost:8081
  realm: ftth-realm
  # Service Account for Backend to manage users
  client-id: ftth-gis-backend
  client-secret: sA5ras1iCWdAabeHQVQMRsnNfoGhZb2R

# Custom Config for App Security
# Note: 'app' is a custom property. The IDE warning 'Unknown property' is safe to ignore
# as it is not part of the internal Spring Boot schema.
app:
  seeder:
    enabled: false  # Disable auto-purge of existing data
  security:
    cors:
      allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,http://192.168.40.11:3000"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"

logging:
  level:
    "[org.hibernate.SQL]": INFO
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
    "[org.springframework.security]": DEBUG
