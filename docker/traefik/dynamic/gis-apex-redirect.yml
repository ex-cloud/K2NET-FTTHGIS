# Apex gis.kdua.net is RESERVED (not a tenant slug) — redirect visitors to Public Marketing Website.
http:
  middlewares:
    redirect-gis-apex:
      redirectRegex:
        regex: "^https?://gis\\.kdua\\.net/(.*)"
        replacement: "https://kdua.net/"
        permanent: false

  routers:
    gis-apex-redirect:
      rule: "Host(`gis.kdua.net`)"
      entrypoints:
        - websecure
      middlewares:
        - redirect-gis-apex
      service: noop@internal
      priority: 200
      tls: {}
