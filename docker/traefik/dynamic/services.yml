http:
  routers:
    sms-webhook-router:
      rule: "(Host(`ops.kdua.net`) || Host(`api-gis.kdua.net`) || HostRegexp(`^[a-z0-9-]+\\.kdua\\.net$`)) && PathPrefix(`/webhooks/sms`)"
      entrypoints:
        - websecure
      tls: {}
      service: sms-webhook-service
      priority: 15

  middlewares:
    secHeaders:
      headers:
        sslRedirect: true
        contentTypeNosniff: true
        browserXssFilter: true
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"

  services:
    sms-webhook-service:
      loadBalancer:
        servers:
          - url: "http://ftth-notification-gateway:5001"
