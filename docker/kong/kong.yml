_transform: true

# =============================================================================
# K2NET FTTH GIS — Hardened & Non-Breaking Kong Gateway Configuration
# 
# Key Security Improvements:
#   1. Anti-Spoofing & Verified Gateway Token:
#      - Global post-function clears all client-supplied identity & mesh headers.
#      - Identity headers (X-User-*, X-Tenant-*, X-Actor-*) & X-Gateway-Token
#        are injected ONLY when the jwt plugin verifies a legitimate RS256 signature.
#      - Anonymous / public routes receive NO internal X-Gateway-Token.
#   2. Fixed WhatsApp Webhook:
#      - strip_path: true ensures /api/v1/wa/webhook proxies to /wa/webhook on :5005.
#   3. Restricted Actuator:
#      - Only /actuator/health is exposed, restricted to internal CIDR (127.0.0.1, 172.18.0.0/16).
#   4. Preserved Realtime SSE & Provisioning Streams (Zero Breaking Changes):
#      - Dedicated backend-stream-routes allows query param (?access_token=)
#        for EventSource on map tiles, notifications, and tenant provisioning stream.
#   5. Preserved Impersonation Refresh Relay:
#      - Impersonation exchange & refresh-token are protected by session headers & rate limits
#        without premature JWT expiration blocking.
#   6. Clean Consumer Registry:
#      - Exactly 1 consumer per Keycloak realm, matching KongConfigSyncService naming.
#   7. Hardened CORS:
#      - Restricts origins to *.kdua.net and local dev ports, allowing X-Impersonation-Session-Id.
# =============================================================================

