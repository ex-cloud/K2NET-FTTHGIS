_format_version: "3.0"
_transform: true

# ====================================================
# Consumers
# ====================================================
consumers:
  # Keycloak JWT consumer — maps to authenticated users
  - username: keycloak-users
    jwt_secrets:
      - key: "https://auth-gis.kdua.net/realms/ftth-realm"
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA1BDG7IW1rQ5nT15YWx0A
          7ZYBjrhriHUqw3NvUKVzVAOYQUTdE1MeWTPUv/dhMySuFSCg5EmObgzvML5OaGy5
          5UOVktaNUuXed/hXRD1JiS59xkcX625fIYPEqirx7j9dQMnmKqadZjvnPMj1nZgt
          Va+kSaiDr+FLkFJ86jvsBc2RNXwEJECCqqA6n72mSdXTnyBoX+xuUHTifANMPKhE
          wh8X5FyNPhN+xNPe1XVoHZWz0J15rmKOewQpvzXbS4+nOtjFAYt/3ovJl0/vEE7o
          VCU5os2t27UgRpbX39JKtKb0lWswX7fyAyfPmcrsmJUXnXkgE+8kCaqQ7Gid6aVu
          ZQIDAQAB
          -----END PUBLIC KEY-----

  # Anonymous consumer — allows requests without a valid JWT to pass through
  - username: anonymous-user

# ====================================================
# Services & Routes
# ====================================================
services:
  # ─── Spring Boot Backend ────────────────────────────────────────────────────
  - name: backend-service
    url: http://backend:9090
    routes:
      # Public pre-login routes — no JWT needed (Spring Boot Security handles permitAll)
      - name: backend-public-routes
        paths:
          - /api/v1/auth
          - /api/v1/organizations/check-slug
          - /api/v1/organizations/register
          - /api/v1/network/map
          - /api/v1/network/mvt
          - /api/v1/network/notifications
          - /api/v1/system/impersonate/exchange
        strip_path: false

      # Protected API routes — strict RS256 JWT required (401 if invalid or missing)
      - name: backend-api-route
        paths:
          - /api/v1
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
              uri_param_names:
                - jwt
                - access_token
                - token
              run_on_preflight: false
      - name: backend-actuator-route
        paths:
          - /actuator
        strip_path: false
      # GitHub webhook — no JWT (GitHub signs its own payload via HMAC-SHA256)
      # Signature validated at Spring Boot layer. Noise-filtered from audit log.
      - name: backend-github-webhook-route
        paths:
          - /api/github/webhook
        methods:
          - POST
        strip_path: false

  # ─── 1. Notification Gateway (Port 5001) ───────────────────────────────────
  - name: notification-gateway
    url: http://ftth-notification-gateway:5001
    routes:
      - name: notify-route
        paths:
          - /api/v1/notify
          - /api/v1/notification
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
      # NOTE: /api/v1/gateway-status is NOT exposed here.
      # Gateway health is proxied server-side via Spring Boot GatewayStatusController
      # at /api/v1/system/gateway-status (covered by backend-api-route JWT protection).
      # GATEWAY_TOKEN is strictly internal — it NEVER reaches the browser.

  # ─── 2. Payment Gateway (Port 5002) ────────────────────────────────────────
  - name: payment-gateway
    url: http://ftth-payment-gateway:5002
    routes:
      - name: payment-invoice-route
        paths:
          - /api/v1/invoice
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
      - name: payment-webhook-route
        paths:
          - /webhooks/payment
        strip_path: false
        methods:
          - POST

  # ─── 3. Map Gateway (Port 5003) ─────────────────────────────────────────────
  - name: map-gateway
    url: http://ftth-map-gateway:5003
    routes:
      - name: geocode-route
        paths:
          - /api/v1/geocode
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp

  # ─── 4. Storage Gateway (Port 5004) ─────────────────────────────────────────
  - name: storage-gateway
    url: http://ftth-storage-gateway:5004
    routes:
      - name: storage-route
        paths:
          - /api/v1/storage
          - /api/v1/stats
          - /api/v1/upload
          - /api/v1/presigned-url
          - /api/v1/bucket-stats
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp

  # ─── 5. WhatsApp Gateway (Port 5005) ────────────────────────────────────────
  - name: whatsapp-gateway
    url: http://ftth-whatsapp-gateway:5005
    routes:
      - name: wa-api-route
        paths:
          - /api/v1/wa
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp

  # ─── WhatsApp Webhook (Bypass JWT + IP Whitelisting) ────────────────────────
  - name: whatsapp-webhook
    url: http://ftth-whatsapp-gateway:5005/wa/webhook
    routes:
      - name: wa-webhook-route
        paths:
          - /api/v1/wa/webhook
        strip_path: false
        plugins:
          - name: ip-restriction
            config:
              allow:
                - 163.70.0.0/16
                - 129.134.0.0/16
                - 157.240.0.0/16
                - 173.252.64.0/18
                - 185.89.216.0/22
                - 31.13.64.0/18
                - 127.0.0.1
                - 172.18.0.0/16

  # ─── 6. Scheduler Gateway (Port 5006) ───────────────────────────────────────
  - name: scheduler-gateway
    url: http://ftth-scheduler-gateway:5006
    routes:
      - name: scheduler-route
        paths:
          - /api/v1/scheduler
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp

  # ─── 7. Export Gateway (Port 5007) ──────────────────────────────────────────
  - name: export-gateway
    url: http://ftth-export-gateway:5007
    routes:
      - name: export-route
        paths:
          - /api/v1/export
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp

  # ─── 8. OLT Gateway (Port 5008) ─────────────────────────────────────────────
  - name: olt-gateway
    url: http://ftth-olt-gateway:5008
    routes:
      - name: olt-route
        paths:
          - /api/v1/olt
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
      - name: ont-route
        paths:
          - /api/v1/ont
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp

  # ─── 9. Audit Gateway (Port 5009) ─────────────────────────────────────────────
  - name: audit-gateway
    url: http://ftth-audit-gateway:5009
    routes:
      - name: audit-route
        paths:
          - /api/v1/audit
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp

  # ─── 10. Task Gateway (Port 5011) ──────────────────────────────────────────
  - name: task-gateway
    url: http://ftth-task-gateway:5011
    routes:
      - name: task-gateway-route
        paths:
          - /api/v1/task-gateway
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp

  # ─── 10b. Poller Service (Port 5010) ───────────────────────────────────────
  - name: poller-service
    url: http://ftth-poller:5010
    routes:
      - name: poller-device-status-route
        paths:
          - /api/v1/devices
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp



  # ─── 11. AI Assistant Gateway (Python FastAPI - Port 5012) ────────────────
  - name: ai-gateway
    url: http://ftth-ai-gateway:5012
    routes:
      - name: ai-chat-route
        paths:
          - /api/v1/ai
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
              uri_param_names:
                - jwt
                - access_token
                - token
              run_on_preflight: false

  # ─── 12. Observability Gateway (Go - Port 5013) ───────────────────────────
  - name: observability-gateway
    url: http://ftth-observability-gateway:5013
    routes:
      # Standard versioned REST path — consistent with all 13 microservices
      - name: observability-v1-route
        paths:
          - /api/v1/observability
        strip_path: false
        methods:
          - GET
          - POST
          - OPTIONS
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
              uri_param_names:
                - jwt
                - access_token
                - token
              run_on_preflight: false

# ====================================================
# Global Plugins
# ====================================================
plugins:
  # ─── CORS ───────────────────────────────────────────────────────────────────
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - PATCH
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600

  # ─── Multi-Tenant Claims Extraction & Anti-Spoofing (Global Mesh) ───────────
  - name: post-function
    config:
      access:
        - |
          -- 1. Explicitly clear all upstream tenant & user headers from incoming client request (Anti-Spoofing)
          kong.service.request.clear_header("X-Tenant-Id")
          kong.service.request.clear_header("X-Tenant-ID")
          kong.service.request.clear_header("X-User-Id")
          kong.service.request.clear_header("X-User-Email")
          kong.service.request.clear_header("X-User-Username")
          kong.service.request.clear_header("X-Actor-ID")
          kong.service.request.clear_header("X-Actor-Role")
          kong.service.request.clear_header("X-Gateway-Token")

          -- 2. Inject internal Gateway Mesh Token for all upstream calls
          local gwToken = os.getenv("GATEWAY_TOKEN")
          if gwToken and gwToken ~= "" then
              kong.service.request.set_header("X-Gateway-Token", gwToken)
          end

          -- 3. Extract and decode Keycloak JWT Bearer Token claims
          local auth_header = kong.request.get_header("Authorization") or ""
          local token = string.match(auth_header, "Bearer%s+(.+)")
          if not token then
              local query_params = kong.request.get_query()
              token = query_params["access_token"] or query_params["jwt"] or query_params["token"]
          end

          if token then
              local parts = {}
              for part in string.gmatch(token, "[^%.]+") do
                  table.insert(parts, part)
              end
              if #parts >= 2 then
                  local cjson = require("cjson.safe")
                  local payload_b64 = parts[2]
                  local rem = #payload_b64 % 4
                  if rem == 2 then payload_b64 = payload_b64 .. "=="
                  elseif rem == 3 then payload_b64 = payload_b64 .. "=" end
                  payload_b64 = string.gsub(string.gsub(payload_b64, "-", "+"), "_", "/")

                  local decoded = ngx.decode_base64(payload_b64)
                  if decoded then
                      local claims = cjson.decode(decoded)
                      if claims then
                          kong.service.request.set_header("X-User-Id", claims.sub or "")
                          kong.service.request.set_header("X-User-Email", claims.email or "")
                          kong.service.request.set_header("X-User-Username", claims.preferred_username or "")
                          kong.service.request.set_header("X-Actor-ID", claims.sub or "")

                          if claims.realm_access and claims.realm_access.roles then
                              kong.service.request.set_header("X-Actor-Role", table.concat(claims.realm_access.roles, ","))
                          end

                          local tenantId = claims.tenant_id or claims.organization_id or claims.tenant_slug
                          if tenantId and tenantId ~= "" then
                              kong.service.request.set_header("X-Tenant-Id", tenantId)
                              kong.service.request.set_header("X-Tenant-ID", tenantId)
                          else
                              local iss = claims.iss
                              local realm = nil
                              if iss then
                                  local iss_parts = {}
                                  for p in string.gmatch(iss, "[^/]+") do
                                      table.insert(iss_parts, p)
                                  end
                                  realm = iss_parts[#iss_parts]
                              end
                              if realm and realm ~= "ftth-realm" and realm ~= "master" then
                                  kong.service.request.set_header("X-Tenant-Id", realm)
                                  kong.service.request.set_header("X-Tenant-ID", realm)
                              else
                                  kong.service.request.set_header("X-Tenant-Id", "00000000-0000-0000-0000-000000000000")
                                  kong.service.request.set_header("X-Tenant-ID", "00000000-0000-0000-0000-000000000000")
                              end
                          end
                      end
                  end
              end
          end


