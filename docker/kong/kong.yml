# ====================================================
# Global Plugins
# ====================================================
plugins:
  # ─── CORS ───────────────────────────────────────────────────────────────────
  # Restricts cross-origin requests to *.kdua.net and authorized local dev ports,
  # while allowing essential headers including X-Impersonation-Session-Id.
  - name: cors
    config:
      origins:
        - "https://[a-z0-9.-]+\\.kdua\\.net"
      methods: [GET, POST, PUT, DELETE, OPTIONS, PATCH]
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Impersonation-Session-Id
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600
      preflight_continue: false

  # ─── Multi-Tenant Claims Extraction & Anti-Spoofing (Global Post-Function) ──
  # Runs after the jwt plugin. Identity headers & internal mesh token (X-Gateway-Token)
  # are produced ONLY when the jwt plugin has verified an authentic RS256 Keycloak signature.
  # Anonymous or public requests have all identity headers stripped and receive NO gateway token.
  - name: post-function
    config:
      access:
        - |
          local PLATFORM_REALM  = "ftth-realm"
          local PLATFORM_TENANT = "00000000-0000-0000-0000-000000000000"
          local BASE_DOMAIN     = "kdua%.net"
          local RESERVED        = { system = true, api = true, gis = true, auth = true }

          local req, svc = kong.request, kong.service.request

          -- 1. Anti-Spoofing: Clear all tenant & user headers passed from client
          for _, h in ipairs({
            "X-Tenant-Id", "X-Tenant-ID", "X-Tenant-Slug", "X-Tenant-Realm", "X-User-Id",
            "X-User-Email", "X-User-Username", "X-Actor-Id", "X-Actor-Role",
            "X-Gateway-Token",
          }) do
            svc.clear_header(h)
          end

          -- 2. Verify legitimate credential from jwt plugin
          local cred = kong.client.get_credential()
          local consumer = kong.client.get_consumer()
          local cname = consumer and consumer.username or ""
          if not cred or cname == "anonymous-stream-consumer" then
            -- Anonymous / Public Route / Stream Fallback: Strip client-supplied X-Consumer-* / X-Credential-* headers
            for name in pairs(req.get_headers()) do
              local l = name:lower()
              if l:find("^x%-consumer%-") or l:find("^x%-credential%-") or l == "x-anonymous-consumer" then
                svc.clear_header(name)
              end
            end
            return -- Halt here. No identity stamped, no X-Gateway-Token.
          end

          local function deny()
            return kong.response.exit(401, { message = "Unauthorized" })
          end
          local function str(v)
            return type(v) == "string" and v or ""
          end

          -- 3. Extract verified token from Authorization header or allowed query parameters
          local token = kong.ctx.shared.authenticated_jwt_token
          if type(token) ~= "string" then
            token = (req.get_header("Authorization") or ""):match("^[Bb]earer%s+(.+)$")
          end
          if type(token) ~= "string" then
            local q = req.get_query()
            for _, k in ipairs({ "access_token", "jwt", "token" }) do
              if type(q[k]) == "string" then token = q[k]; break end
            end
          end
          if type(token) ~= "string" then return deny() end

          local payload_b64 = token:match("^[^%.]+%.([^%.]+)%.")
          if not payload_b64 then return deny() end
          payload_b64 = payload_b64:gsub("%-", "+"):gsub("_", "/")
          local rem = #payload_b64 % 4
          if rem == 2 then payload_b64 = payload_b64 .. "==" elseif rem == 3 then payload_b64 = payload_b64 .. "=" end

          local claims = require("cjson.safe").decode(ngx.decode_base64(payload_b64) or "")
          if type(claims) ~= "table" then return deny() end

          -- 4. Derive realm from verified credential key (Keycloak issuer)
          local realm = type(cred.key) == "string" and cred.key:match("/realms/([^/]+)$") or nil
          if not realm or claims.iss ~= cred.key then return deny() end

          -- 5. Set authenticated user & actor context headers
          svc.set_header("X-User-Id", str(claims.sub))
          svc.set_header("X-User-Email", str(claims.email))
          svc.set_header("X-User-Username", str(claims.preferred_username))
          svc.set_header("X-Actor-Id", str(claims.sub))

          local roles = {}
          local ra = claims.realm_access
          if type(ra) == "table" and type(ra.roles) == "table" then
            for _, r in ipairs(ra.roles) do
              if type(r) == "string" then roles[#roles + 1] = r end
            end
          end
          if #roles > 0 then svc.set_header("X-Actor-Role", table.concat(roles, ",")) end

          -- 6. Multi-Tenant isolation & subdomain context resolution
          local tenant
          if realm == PLATFORM_REALM then
            local host = (req.get_host() or ""):lower()
            local slug = host:match("^([a-z0-9%-]+)%-gis%." .. BASE_DOMAIN .. "$")
                      or host:match("^([a-z0-9%-]+)%.gis%." .. BASE_DOMAIN .. "$")
            if slug and not RESERVED[slug] then
              tenant = slug
              svc.set_header("X-Tenant-Slug", slug)
            else
              tenant = PLATFORM_TENANT
            end
          else
            for _, v in ipairs({ claims.tenant_id, claims.organization_id, claims.tenant_slug }) do
              if type(v) == "string" and v ~= "" then tenant = v; break end
            end
            tenant = tenant or realm
          end
          svc.set_header("X-Tenant-Id", tenant)
          svc.set_header("X-Tenant-ID", tenant)
          svc.set_header("X-Tenant-Realm", realm)

          -- 7. Inject internal mesh token ONLY for verified authenticated calls
          local gw = os.getenv("GATEWAY_TOKEN")
          if gw and gw ~= "" then svc.set_header("X-Gateway-Token", gw) end
