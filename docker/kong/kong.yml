_format_version: "3.0"
_transform: true

services:
  # ====================================================
  # Spring Boot Backend (Docker container)
  # ====================================================
  - name: backend-service
    url: http://backend:9090
    routes:
      - name: backend-api-route
        paths:
          - /api/v1
        strip_path: false
      - name: backend-actuator-route
        paths:
          - /actuator
        strip_path: false

  # ====================================================
  # Go Microservices (systemd on host)
  # ====================================================
  - name: map-gateway-service
    url: http://host.docker.internal:5003
    routes:
      - name: map-gateway-route
        paths:
          - /gateway/map
        strip_path: true

  - name: notification-gateway-service
    url: http://host.docker.internal:5001
    routes:
      - name: notification-gateway-route
        paths:
          - /gateway/notification
        strip_path: true

  - name: payment-gateway-service
    url: http://host.docker.internal:5002
    routes:
      - name: payment-gateway-route
        paths:
          - /gateway/payment
        strip_path: true
      - name: payment-webhook-route
        paths:
          - /webhooks/payment
        strip_path: false
        methods:
          - POST

  - name: storage-gateway-service
    url: http://host.docker.internal:5004
    routes:
      - name: storage-gateway-route
        paths:
          - /gateway/storage
        strip_path: true

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      second: 30
      minute: 1000
      policy: local
