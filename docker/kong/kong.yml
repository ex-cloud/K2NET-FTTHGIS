# ====================================================
# Services & Routes
# ====================================================
services:
  # ─── Spring Boot Backend (Port 9090) ────────────────────────────────────────
  - name: backend-service
    url: http://backend:9090
    routes:
      # --- 1. Public Pre-Login Routes (No JWT, Spring Boot handles permitAll) ---
      - name: backend-public-routes
        paths:
          - "~/api/v1/public(/|$)"
        regex_priority: 110
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 120
              policy: local
              limit_by: ip
              fault_tolerant: true
          - name: request-size-limiting
            config:
              allowed_payload_size: 2

      - name: backend-auth-routes
        paths:
          - "~/api/v1/auth(/|$)"
        regex_priority: 110
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: local
              limit_by: ip
              fault_tolerant: true
          - name: request-size-limiting
            config:
              allowed_payload_size: 1

      - name: backend-org-signup-routes
        paths:
          - "~/api/v1/organizations/check-slug(/[^/]+)?$"
          - "~/api/v1/organizations/register$"
        regex_priority: 110
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 30
              policy: local
              limit_by: ip
              fault_tolerant: true
          - name: request-size-limiting
            config:
              allowed_payload_size: 2

      # --- 2. Impersonation Routes ---
      # Exchange & Refresh-Token: Exchange uses single-use code; refresh uses X-Impersonation-Session-Id
      # when the Keycloak access token is specifically expired.
      - name: backend-impersonate-public-routes
        paths:
          - "~/api/v1/system/impersonate/(exchange|refresh-token|exit)$"
        regex_priority: 110
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 30
              policy: local
              limit_by: ip
              fault_tolerant: true
          - name: request-size-limiting
            config:
              allowed_payload_size: 1

      # --- 3. SSE & Real-Time Streams (JWT Required + EventSource Query Token Allowed) ---
      # Browser EventSource CANNOT pass custom HTTP headers. It requires ?access_token= query parameter.
      - name: backend-stream-routes
        paths:
          - "~/api/v1/network/notifications(/|$)"
          - "~/api/v1/network/(map|mvt)(/|$)"
          - "~/api/v1/organizations/provisioning/stream/[^/]+$"
          - "~/api/v1/tasks/stream(/|$)"
        regex_priority: 120
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
              maximum_expiration: 3600
              uri_param_names:
                - access_token
                - jwt
                - token
              anonymous: anonymous-stream-consumer
              run_on_preflight: false

      # --- 4. Protected API Routes (Default Backend Fallback) ---
      - name: backend-api-route
        paths:
          - /api/v1
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
              maximum_expiration: 3600
              uri_param_names: []
              run_on_preflight: false

      # --- 5. Internal Actuator Health Check (Restricted to Internal CIDR) ---
      - name: backend-actuator-health-route
        paths:
          - "~/actuator/health(/|$)"
        regex_priority: 110
        strip_path: false
        methods:
          - GET
        plugins:
          - name: ip-restriction
            config:
              allow:
                - 127.0.0.1
                - 172.18.0.0/16

      # --- 6. GitHub Webhook ---
      - name: backend-github-webhook-route
        paths:
          - /api/github/webhook
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: local
              limit_by: ip
              fault_tolerant: true
          - name: request-size-limiting
            config:
              allowed_payload_size: 5

  # ─── 1. Notification Gateway (Port 5001) ───────────────────────────────────
  - name: notification-gateway
    url: http://ftth-notification-gateway:5001
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
          maximum_expiration: 3600
