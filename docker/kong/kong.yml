_format_version: "3.0"
_transform: true

# ====================================================
# Consumers
# ====================================================
consumers:
  # Keycloak JWT consumer — maps to authenticated users
  - username: keycloak-users
    jwt_secrets:
      - key: "https://auth-gis.kdua.net/realms/ftth-realm"
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA1UQGxFRrdQqlqCq2ylve
          fxDYLwJSPfjS+wYUcMQ4ZX/MBgPwm+wW3+LokFsVExqT+9NhK5yVcwRQJ27JdTMv
          n8hV10sVjpKzqjQGthOwQ193nNnUGw1UqgRw29yTenc5qMlTqcgs/0uXif4HCqfB
          83sZR0IFrZ1Dcpwh0+1kRxIyyiKpPqSTT8JtJTa6590sAljxM/TF/Ow60asqxBo+
          z5OyU01ocJH+tPKv9LpZS+TcIyLuZQh/ikQjsQd8yJwlEG0SiLSEjPCXcnYUWFI8
          UH/lcJji2aFaGrIERnILEZrEkjQD12/R7CsU5ZNJaCadNWlCtE2fTjZAZCaW/1PM
          IwIDAQAB
          -----END PUBLIC KEY-----

  # Anonymous consumer — allows requests without a valid JWT to pass through
  - username: anonymous-user

# ====================================================
# Services & Routes
# ====================================================
services:
  # ─── Spring Boot Backend ────────────────────────────────────────────────────
  - name: backend-service
    url: http://backend:9090
    routes:
      - name: backend-api-route
        paths:
          - /api/v1
        strip_path: false
        plugins:
          - name: jwt
            config:
              anonymous: anonymous-user
              claims_to_verify:
                - exp
              run_on_preflight: false
      - name: backend-actuator-route
        paths:
          - /actuator
        strip_path: false
      # GitHub webhook — no JWT (GitHub signs its own payload via HMAC-SHA256)
      # Signature validated at Spring Boot layer. Noise-filtered from audit log.
      - name: backend-github-webhook-route
        paths:
          - /api/github/webhook
        methods:
          - POST
        strip_path: false

  # ─── 1. Notification Gateway (Port 5001) ───────────────────────────────────
  - name: notification-gateway
    url: http://ftth-notification-gateway:5001
    routes:
      - name: notify-route
        paths:
          - /api/v1/notify
        strip_path: false
        plugins:
          - name: jwt
            config:
              anonymous: anonymous-user
              claims_to_verify:
                - exp

  # ─── 2. Payment Gateway (Port 5002) ────────────────────────────────────────
  - name: payment-gateway
    url: http://ftth-payment-gateway:5002
    routes:
      - name: payment-invoice-route
        paths:
          - /api/v1/invoice
        strip_path: false
        plugins:
          - name: jwt
            config:
              anonymous: anonymous-user
              claims_to_verify:
                - exp
      - name: payment-webhook-route
        paths:
          - /webhooks/payment
        strip_path: false
        methods:
          - POST

  # ─── 3. Map Gateway (Port 5003) ─────────────────────────────────────────────
  - name: map-gateway
    url: http://ftth-map-gateway:5003
    routes:
      - name: geocode-route
        paths:
          - /api/v1/geocode
        strip_path: false
        plugins:
          - name: jwt
            config:
              anonymous: anonymous-user
              claims_to_verify:
                - exp

  # ─── 4. Storage Gateway (Port 5004) ─────────────────────────────────────────
  - name: storage-gateway
    url: http://ftth-storage-gateway:5004
    routes:
      - name: storage-route
        paths:
          - /api/v1/storage
        strip_path: false
        plugins:
          - name: jwt
            config:
              anonymous: anonymous-user
              claims_to_verify:
                - exp

  # ─── 5. WhatsApp Gateway (Port 5005) ────────────────────────────────────────
  - name: whatsapp-gateway
    url: http://ftth-whatsapp-gateway:5005
    routes:
      - name: wa-api-route
        paths:
          - /api/v1/wa
        strip_path: false
        plugins:
          - name: jwt
            config:
              anonymous: anonymous-user
              claims_to_verify:
                - exp

  # ─── WhatsApp Webhook (Bypass JWT + IP Whitelisting) ────────────────────────
  - name: whatsapp-webhook
    url: http://ftth-whatsapp-gateway:5005/wa/webhook
    routes:
      - name: wa-webhook-route
        paths:
          - /api/v1/wa/webhook
        strip_path: false
        plugins:
          - name: ip-restriction
            config:
              allow:
                - 163.70.0.0/16
                - 129.134.0.0/16
                - 157.240.0.0/16
                - 173.252.64.0/18
                - 185.89.216.0/22
                - 31.13.64.0/18
                - 127.0.0.1
                - 172.18.0.0/16

  # ─── 6. Scheduler Gateway (Port 5006) ───────────────────────────────────────
  - name: scheduler-gateway
    url: http://ftth-scheduler-gateway:5006
    routes:
      - name: scheduler-route
        paths:
          - /api/v1/scheduler
        strip_path: false
        plugins:
          - name: jwt
            config:
              anonymous: anonymous-user
              claims_to_verify:
                - exp

  # ─── 7. Export Gateway (Port 5007) ──────────────────────────────────────────
  - name: export-gateway
    url: http://ftth-export-gateway:5007
    routes:
      - name: export-route
        paths:
          - /api/v1/export
        strip_path: false
        plugins:
          - name: jwt
            config:
              anonymous: anonymous-user
              claims_to_verify:
                - exp

  # ─── 8. OLT Gateway (Port 5008) ─────────────────────────────────────────────
  - name: olt-gateway
    url: http://ftth-olt-gateway:5008
    routes:
      - name: olt-route
        paths:
          - /api/v1/olt
        strip_path: false
        plugins:
          - name: jwt
            config:
              anonymous: anonymous-user
              claims_to_verify:
                - exp
      - name: ont-route
        paths:
          - /api/v1/ont
        strip_path: false
        plugins:
          - name: jwt
            config:
              anonymous: anonymous-user
              claims_to_verify:
                - exp

  # ─── 9. Audit Gateway (Port 5009) ─────────────────────────────────────────────
  - name: audit-gateway
    url: http://ftth-audit-gateway:5009
    routes:
      - name: audit-route
        paths:
          - /api/v1/audit
        strip_path: false
        plugins:
          - name: jwt
            config:
              anonymous: anonymous-user
              claims_to_verify:
                - exp

  # ─── 10. Task Gateway (Port 5011) ──────────────────────────────────────────
  - name: task-gateway
    url: http://ftth-task-gateway:5011
    routes:
      - name: task-gateway-route
        paths:
          - /api/v1/task-gateway
        strip_path: false
        plugins:
          - name: jwt
            config:
              anonymous: anonymous-user
              claims_to_verify:
                - exp

  # ─── Frontend Admin (Next.js Internal API routes) ───────────────────────────
  # Routes Next.js internal API paths that are NOT backend API calls.
  # These paths are handled by Next.js Route Handlers, NOT Spring Boot.
  # Authentication is managed by next-auth inside Next.js — no Kong JWT needed.
  - name: frontend-admin-service
    url: http://ftth-frontend-admin:3001
    routes:
      - name: frontend-observability-api-route
        paths:
          - /api/observability
        strip_path: false
      - name: frontend-nextauth-route
        paths:
          - /api/auth
        strip_path: false
      - name: frontend-ai-api-route
        paths:
          - /api/ai
        strip_path: false
      - name: frontend-system-api-route
        paths:
          - /api/system
        strip_path: false

  # ─── 11. AI Assistant Gateway (Python FastAPI - Port 5012) ────────────────
  - name: ai-gateway
    url: http://ftth-ai-gateway:5012
    routes:
      - name: ai-chat-route
        paths:
          - /api/v1/ai
        strip_path: false
        methods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt
            config:
              anonymous: anonymous-user
              claims_to_verify:
                - exp
          - name: request-transformer
            config:
              add:
                headers:
                  - "X-Gateway-Token:2dcac271c2b24a4de521951d1a413000"
                  - "X-Tenant-ID:00000000-0000-0000-0000-000000000000"

  # ─── 12. Observability Gateway (Go - Port 5013) ───────────────────────────
  - name: observability-gateway
    url: http://ftth-observability-gateway:5013
    routes:
      - name: observability-gateway-route
        paths:
          - /api/gateway/observability
        strip_path: true
        methods:
          - GET
          - OPTIONS
        plugins:
          - name: jwt
            config:
              anonymous: anonymous-user
              claims_to_verify:
                - exp
          - name: request-transformer
            config:
              add:
                headers:
                  - "X-Gateway-Token:2dcac271c2b24a4de521951d1a413000"

# ====================================================
# Global Plugins
# ====================================================
plugins:
  # ─── CORS ───────────────────────────────────────────────────────────────────
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600

  # ─── Multi-Tenant Claims Extraction & Anti-Spoofing (Global Mesh) ───────────
  - name: post-function
    config:
      access:
        - |
          -- 1. Explicitly clear all upstream tenant & user headers from incoming client request (Anti-Spoofing)
          kong.service.request.clear_header("X-Tenant-Id")
          kong.service.request.clear_header("X-Tenant-ID")
          kong.service.request.clear_header("X-User-Id")
          kong.service.request.clear_header("X-User-Email")
          kong.service.request.clear_header("X-User-Username")
          kong.service.request.clear_header("X-Actor-ID")

          -- 2. Extract verified claims from Keycloak JWT token
          local claims = kong.ctx.shared.jwt_claims
          if claims then
              kong.service.request.set_header("X-User-Id", claims.sub or "")
              kong.service.request.set_header("X-User-Email", claims.email or "")
              kong.service.request.set_header("X-User-Username", claims.preferred_username or "")
              kong.service.request.set_header("X-Actor-ID", claims.sub or "")

              local tenantId = claims.tenant_id or claims.organization_id or claims.tenant_slug
              if tenantId and tenantId ~= "" then
                  kong.service.request.set_header("X-Tenant-Id", tenantId)
                  kong.service.request.set_header("X-Tenant-ID", tenantId)
              else
                  local iss = claims.iss
                  if iss then
                      local parts = {}
                      for part in string.gmatch(iss, "[^/]+") do
                          table.insert(parts, part)
                      end
                      local realm = parts[#parts]
                      if realm ~= "ftth-realm" then
                          kong.service.request.set_header("X-Tenant-Id", realm)
                          kong.service.request.set_header("X-Tenant-ID", realm)
                      end
                  end
              end
          end


