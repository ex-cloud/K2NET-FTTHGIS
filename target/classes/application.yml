server:
  port: 9090
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/x-protobuf
    min-response-size: 1024

spring:
  application:
    name: ftth-gis-core

  datasource:
    url: jdbc:postgresql://localhost:5432/ftth_gis
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # Gunakan update agar data tidak hilang saat restart
    properties:
      "[hibernate.format_sql]": true

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ftth-realm
          jwk-set-uri: http://localhost:8081/realms/ftth-realm/protocol/openid-connect/certs

# Keycloak Admin Configuration
keycloak:
  server-url: http://localhost:8081
  realm: master
  # Service Account for Backend to manage everything (from master realm)
  client-id: admin-cli
  # client-secret: CbIH3jwRJ6VnLFj2xUly0b5Dz8vzOUHu
  grant-type: password
  username: excloud
  password: 123456

# Custom Config for App Security
# Note: 'app' is a custom property. The IDE warning 'Unknown property' is safe to ignore
# as it is not part of the internal Spring Boot schema.
app:
  seeder:
    enabled: false # Data sudah sinkron. Set true HANYA jika ingin reset ulang semua aset.
  frontend-url: ${FRONTEND_URL:localhost:3000}
  security:
    keycloak:
      provision-client-id: ${AUTH_KEYCLOAK_ID:ftth-gis-frontend}
      provision-client-secret: ${AUTH_KEYCLOAK_SECRET:DtQ5wZE9uCsenEM2eIRu0wFv7ioLhAmd}
    cors:
      allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,http://192.168.40.11:3000"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"

logging:
  level:
    "[org.hibernate.SQL]": INFO
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
    "[org.springframework.security]": DEBUG
