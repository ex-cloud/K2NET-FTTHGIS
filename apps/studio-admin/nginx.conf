server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ──────────────────────────────────────────────────────
    # Hide Nginx version & server signatures
    server_tokens off;

    # Content Security Policy — admin-only SPA, strict origin policy
    # Note: 'unsafe-inline' on script-src required for Keycloak silent-check-sso inline script.
    # Once Keycloak adapter is fully migrated to PKCE nonce, this can be tightened.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https://keycloak.k2net.id https://admin.k2net.id; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # Referrer policy — only send origin on cross-site requests
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy — disable browser features not needed by admin panel
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Cross-Origin isolation headers (Spectre/side-channel attack mitigation)
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # HTTP Strict Transport Security — 1 year (enforced only via HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # ─────────────────────────────────────────────────────────────────────────

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";



    # ── API Proxy → Kong Gateway ──────────────────────────────────────────────
    # All /api/v1 and /webhooks requests are forwarded to Kong which handles
    # JWT validation and routes to the correct backend microservice.
    location /api/ {
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /webhooks/ {
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # ─────────────────────────────────────────────────────────────────────────

    # Static assets cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Silent check SSO fallback
    location /silent-check-sso.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Healthcheck
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}
